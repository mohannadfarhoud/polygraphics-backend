# Full site: UI at /, API at /polygraph/, assets at /output/ and /uploads/
# Install on server: /etc/nginx/sites-available/polygraphics
#
# UI deploy path: /var/www/tryonme-ui
#   scp -r dist/* root@49.12.204.14:/var/www/tryonme-ui/
#
# API env ( /opt/polygraphics-backend/.env ):
#   APP_ROOT_PATH=/polygraph
#   APP_PUBLIC_BASE_URL=http://tryonme.net/polygraph
#   APP_MODEL_BASE_URL=http://tryonme.net/polygraph/output
#   APP_UPLOADS_BASE_URL=http://tryonme.net/polygraph/uploads
#   APP_CORS_ORIGINS=http://tryonme.net,https://tryonme.net

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tryonme.net www.tryonme.net;

    client_max_body_size 250M;

    # --- Frontend (Vite/React/Vue static build) ---
    root /var/www/tryonme-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets (adjust if your bundler uses /assets/)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- polyGraphics API (strip /polygraph prefix → uvicorn) ---
    location ^~ /polygraph/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Relative model/upload URLs (when APP_*_BASE_URL uses /polygraph/... paths)
    location ^~ /output/ {
        proxy_pass http://127.0.0.1:8000/output/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 250M;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 250M;
    }
}

# Optional: api subdomain → API only (no UI)
server {
    listen 80;
    listen [::]:80;
    server_name api.tryonme.net;

    client_max_body_size 250M;

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
