# HTTPS + WebSocket for tryonme.net
# Certs: certbot certonly --webroot -w /var/www/tryonme-ui -d tryonme.net -d www.tryonme.net -d api.tryonme.net
# Also install: /etc/nginx/conf.d/polygraph-ws-map.conf (map for Connection upgrade)

# --- HTTP → HTTPS redirect + ACME ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tryonme.net www.tryonme.net api.tryonme.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tryonme-ui;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main site: UI + API under /polygraph/ ---
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name tryonme.net www.tryonme.net;

    ssl_certificate     /etc/letsencrypt/live/tryonme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryonme.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 250M;

    root /var/www/tryonme-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # GPU worker WebSocket (explicit path — long-lived)
    location ^~ /polygraph/internal/worker/ws {
        proxy_pass http://127.0.0.1:8000/internal/worker/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /polygraph/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /output/ {
        proxy_pass http://127.0.0.1:8000/output/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 250M;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 250M;
    }
}

# --- API subdomain (optional direct API + worker WS without /polygraph prefix) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tryonme.net;

    ssl_certificate     /etc/letsencrypt/live/tryonme.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryonme.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 250M;

    location ^~ /internal/worker/ws {
        proxy_pass http://127.0.0.1:8000/internal/worker/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
