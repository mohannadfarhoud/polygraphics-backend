# -----------------------------------------------------------------------------
# Nginx: API + Swagger under /polygraph/ (strip prefix → uvicorn root)
# -----------------------------------------------------------------------------
# Browser: https://domain/polygraph/jobs
# Uvicorn: http://127.0.0.1:8000/jobs
#
# Use together with nginx-output-uploads.conf if JSON uses RELATIVE /output and /uploads
# (not /polygraph/output). Otherwise set APP_MODEL_BASE_URL to .../polygraph/output.
# -----------------------------------------------------------------------------

location ^~ /polygraph/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 250M;
}
