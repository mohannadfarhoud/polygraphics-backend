# -----------------------------------------------------------------------------
# Nginx: expose /output and /uploads at the ROOT of your domain
# -----------------------------------------------------------------------------
# FastAPI serves files at:
#   GET /output/<job_id>.glb|ply   → disk: <APP_ROOT_DIR>/output/
#   GET /uploads/<job_id>/...      → disk: <APP_ROOT_DIR>/uploads/
#
# When your API JSON returns relative URLs like /output/foo.glb or /uploads/.../x.jpg,
# the browser requests https://YOUR_DOMAIN/output/... — those requests hit THIS server
# block, not /polygraph/. You MUST add these locations or the links 404.
#
# Usage: copy the two `location` blocks into your existing `server { }` for
# agentmanager.easymediasuitecloud.com (same server that handles SSL).
# Then:  nginx -t  &&  nginx -s reload   (or systemctl reload nginx)
# -----------------------------------------------------------------------------

location ^~ /output/ {
    proxy_pass http://127.0.0.1:8000/output/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # GLB/PLY can be large; no need to buffer entire body for GET
    proxy_buffering off;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 250M;
}
